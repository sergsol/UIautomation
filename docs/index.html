<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wish List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee;
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    background: rgba(255,255,255,0.05);
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0 0 24px;
    font-size: 28px;
    text-align: center;
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #a78bfa;
  }
  button.add {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #a78bfa, #22d3ee);
    color: #0b1220;
    font-weight: 600;
    cursor: pointer;
  }
  button.add:hover { opacity: 0.9; }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  li.done .text {
    text-decoration: line-through;
    opacity: 0.5;
  }
  li .text { flex: 1; word-break: break-word; }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #a78bfa;
  }
  li button.del {
    background: transparent;
    border: none;
    color: #f87171;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }
  li button.del:hover { color: #ef4444; }
  .empty {
    text-align: center;
    opacity: 0.5;
    padding: 20px 0;
    font-style: italic;
  }
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="app">
  <h1>My Wish List</h1>
  <form class="form" id="form">
    <input type="text" id="input" placeholder="Add something you wish for..." autocomplete="off" required>
    <button type="submit" class="add">Add</button>
  </form>
  <ul id="list"></ul>
  <div class="footer" id="footer"></div>
</div>

<script>
  const KEY = "wishlist.items";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const footer = document.getElementById("footer");

  let items = JSON.parse(localStorage.getItem(KEY) || "[]");

  function save() {
    localStorage.setItem(KEY, JSON.stringify(items));
  }

  function render() {
    list.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Your wish list is empty.";
      list.appendChild(empty);
    } else {
      items.forEach((item, i) => {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.done;
        cb.addEventListener("change", () => {
          items[i].done = cb.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = item.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "×";
        del.title = "Remove";
        del.addEventListener("click", () => {
          items.splice(i, 1);
          save();
          render();
        });

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }
    const done = items.filter(i => i.done).length;
    footer.textContent = items.length
      ? `${done} / ${items.length} granted`
      : "";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    input.value = "";
    save();
    render();
  });

  render();
</script>
</body>
</html>
